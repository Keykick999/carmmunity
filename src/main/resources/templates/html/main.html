<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <title>3D Car Viewer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR&display=swap');

        body {
            margin: 0;
            background-color: #f5f6fa;
            font-family: 'Noto Sans KR', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: fadeIn 0.6s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .viewer-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.06);
            width: 90%;
            max-width: 900px;
            height: 500px;
            margin-top: 60px;
            position: relative;
            overflow: hidden;
        }

        .viewer-container canvas {
            width: 100%;
            height: 100%;
        }

        .slot-selector {
            position: absolute;
            top: 10px;
            right: 15px;
            display: flex;
            gap: 10px;
        }

        .slot-selector button {
            border: none;
            background: #dee2e6;
            padding: 5px 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .slot-selector button:hover {
            background: #adb5bd;
        }

        .button-container {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .action-button {
            padding: 12px 24px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            background-color: #4e73df;
            color: white;
            cursor: pointer;
            transition: background 0.2s;
        }

        .action-button:hover {
            background-color: #374fcf;
        }
    </style>
</head>
<body>

<div class="viewer-container">
    <!-- three.js canvas will be appended here -->
    <div class="slot-selector">
        <button onclick="loadCar(1)">1</button>
        <button onclick="loadCar(2)">2</button>
        <button onclick="loadCar(3)">3</button>
    </div>
</div>

<div class="button-container">
    <button class="action-button" onclick="location.href='/post/create'">글쓰기</button>
    <button class="action-button" onclick="location.href='/car/tune'">튜닝하기</button>
    <button class="action-button" onclick="location.href='/user/edit'">회원 정보 수정</button>
</div>

<script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.141.0/build/three.module.js",
        "GLTFLoader": "https://unpkg.com/three@0.141.0/examples/jsm/loaders/GLTFLoader.js",
        "OrbitControls": "https://unpkg.com/three@0.141.0/examples/jsm/controls/OrbitControls.js"
      }
    }
</script>

<script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'GLTFLoader';
    import { OrbitControls } from 'OrbitControls';

    // localStorage에서 JWT 토큰 가져오기
    const token = 'Bearer ' + localStorage.getItem("token");
    console.log(token);

    if (!token) {
        alert("로그인이 필요합니다.");
        window.location.href = "/";
    }


    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf5f6fa);

    // 배경 이미지 설정
    const loader = new THREE.TextureLoader();
    loader.load('/garage.jpg', (texture) => {
        scene.background = texture;
    }, undefined, (err) => {
        console.error('배경 이미지 로드 실패:', err);
    });

    const camera = new THREE.PerspectiveCamera(75, 900 / 500, 0.1, 1000);
    camera.position.set(0, 2, 20);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(900, 500);
    document.querySelector('.viewer-container').appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // 조명 밝기 향상
    const ambientLight = new THREE.AmbientLight(0xffffff, 1.8); // 기존 1.2 → 1.8
    scene.add(ambientLight);

    scene.add(new THREE.AmbientLight(0xffffff, 1.2));
    const dirLight = new THREE.DirectionalLight(0xffffff, 1);
    dirLight.position.set(5, 10, 7.5);
    scene.add(dirLight);

    let currentModel;

    function loadCar(slotId) {
        const modelUrl = `http://localhost:8080/cars?carId=${slotId}`;
        const loader = new GLTFLoader();

        fetch(modelUrl, {
            headers: { Authorization: token }
        })
            .then(res => {
                if (!res.ok) throw new Error("Fetch 실패: " + res.status);
                return res.arrayBuffer();
            })
            .then(buffer => {
                if (currentModel) scene.remove(currentModel);
                loader.parse(buffer, '', (gltf) => {
                    currentModel = gltf.scene;
                    scene.add(gltf.scene);
                });
            })
            .catch(err => console.error('모델 로딩 오류:', err));
    }

    function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
    }

    animate();
    loadCar(1); // 기본 모델 로드
</script>

</body>
</html>
