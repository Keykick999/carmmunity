<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carmmunity 메인</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <script type="importmap">
        {
          "imports": {
            "three": "https://unpkg.com/three@0.141.0/build/three.module.js",
            "GLTFLoader": "https://unpkg.com/three@0.141.0/examples/jsm/loaders/GLTFLoader.js",
            "OrbitControls": "https://unpkg.com/three@0.141.0/examples/jsm/controls/OrbitControls.js"
          }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@500;700&display=swap');
        body {
            background-color: #f5f6fa;
            font-family: 'Outfit', sans-serif;
            margin: 0;
        }
        .header {
            background-color: white;
            padding: 16px 32px;
            border-bottom: 1px solid #dee2e6;
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .header img {
            height: 40px;
        }
        .header-title {
            font-size: 2rem;
            font-weight: 700;
        }
        .main-layout {
            display: grid;
            grid-template-columns: 280px 1fr;
            height: calc(100vh - 80px);
            padding: 30px;
            gap: 40px;
        }
        .sidebar {
            background-color: white;
            border-radius: 16px;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 0 12px rgba(0, 0, 0, 0.05);
            height: 100%;
        }
        .sidebar img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #ccc;
        }
        .user-info {
            margin-top: 12px;
            text-align: center;
        }
        .user-info h5 {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 6px;
        }
        .user-info p {
            font-size: 0.95rem;
            color: #555;
            margin: 2px 0;
        }
        .user-intro {
            font-size: 0.9rem;
            color: #666;
            background-color: #f8f9fa;
            padding: 12px;
            border-radius: 10px;
            margin-top: 12px;
            width: 100%;
            word-break: break-word;
            min-height: 60px;
        }
        .sidebar-buttons {
            margin-top: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }
        .sidebar .btn {
            width: 100%;
            padding: 12px;
            font-weight: 600;
            border-radius: 8px;
        }
        .viewer-container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.06);
            position: relative;
            overflow: hidden;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .viewer-container canvas {
            width: 90%;
            height: auto;
            max-height: 90%;
            aspect-ratio: 16 / 9;
            border-radius: 16px;
        }
        .slot-selector {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
        }
        .slot-selector button {
            border: none;
            background: #dee2e6;
            padding: 8px 16px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .slot-selector button:hover {
            background: #adb5bd;
        }
    </style>
</head>
<body>
<div class="header">
    <a href="/main"><img src="/image/logo.png" alt="로고" /></a>
    <div class="header-title">Carmmunity</div>
</div>

<div class="main-layout">
    <div class="sidebar">
        <img id="profile-image" src="" alt="사용자 이미지">

        <div class="user-info">
            <h5 id="nickname"></h5>
            <p>이름: <span id="name"></span></p>
            <p>전화번호: <span id="phone"></span></p>
            <p>이메일: <span id="email"></span></p>
            <div class="user-intro" id="introduction"></div>
        </div>

        <div class="sidebar-buttons">
            <a href="/modifyInfo" class="btn btn-outline-primary">회원 정보 수정</a>
            <a href="/postList" class="btn btn-outline-primary">게시글 둘러보기</a>
            <a href="/car-list" class="btn btn-outline-primary">차량 튜닝</a>
        </div>
    </div>

    <div class="viewer-container">
        <div class="slot-selector">
            <button onclick="loadCar(1)">1</button>
            <button onclick="loadCar(2)">2</button>
            <button onclick="loadCar(3)">3</button>
        </div>
    </div>
</div>
<script type="module" src="/js/mainuser.js"></script>
<script type="module" src="/js/maincarviewer.js"></script>
</body>
</html>
