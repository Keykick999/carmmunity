<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>차량 검색 | Carmmunity</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@500;700&display=swap');
        body {
            margin: 0;
            background-color: #f9f9f9;
            font-family: 'Outfit', sans-serif;
        }

        .header {
            background-color: white;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ddd;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.5rem;
            font-weight: 700;
        }

        .logo img { height: 36px; }

        .user-profile {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            cursor: pointer;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .write-button {
            padding: 8px 16px;
            background-color: #333;
            color: white;
            font-weight: 600;
            border-radius: 8px;
            text-decoration: none;
        }

        .write-button:hover { background-color: #555; }

        .filter-wrapper {
            background-color: #fff;
            padding: 30px 20px;
            border-bottom: 1px solid #ddd;
        }

        .filter-box {
            max-width: 1000px;
            margin: auto;
        }

        .filter-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin: 20px 0 10px;
        }

        .filter-options {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .filter-options button {
            padding: 10px 20px;
            background-color: #f5f5f5;
            border: 1px solid #ccc;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }

        .filter-options button:hover {
            border-color: #666;
        }

        .filter-options button.selected {
            background-color: #007BFF;
            color: white;
            border-color: #007BFF;
        }

        .search-button-box {
            text-align: center;
            margin-top: 30px;
        }

        .search-button-box button {
            padding: 12px 30px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }

        .search-button-box button:hover {
            background-color: #0056b3;
        }

        .image-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 40px;
            padding: 40px;
            max-width: 1400px;
            margin: auto;
        }

        .car-card {
            background-color: transparent;
            box-shadow: none;
            border-radius: 0;
            padding: 0;
            text-align: center;
            overflow: visible;
            position: relative;
        }

        .car-card img {
            background-color: transparent;
            width: 250px;
            height: auto;
            margin-bottom: 8px;
            transition: transform 0.3s ease, z-index 0.3s ease;
            z-index: 1;
            position: relative;
            cursor: pointer;
        }

        .car-card:hover img {
            transform: scale(1.08);
            z-index: 10;
        }

        .car-name {
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 4px;
        }

        .car-detail {
            font-size: 0.9rem;
            color: #555;
        }

        .selected-conditions {
            margin-top: 10px;
            font-size: 0.95rem;
            color: #333;
        }
    </style>
</head>
<body>

<header class="header">
    <div class="logo">
        <img src="/image/logo.png" alt="로고">
        Carmmunity
    </div>
    <div class="header-right">
        <a href="/postCreate" class="write-button">+ 글쓰기</a>
        <img src="/assets/default-profile.png" class="user-profile" alt="프로필" onclick="location.href='/main.html'">
    </div>
</header>

<section class="filter-wrapper">
    <div class="filter-box">
        <div class="filter-title">제조사</div>
        <div class="filter-options" id="manufacturerOptions">
            <button onclick="selectManufacturer('Hyundai')">현대</button>
            <button onclick="selectManufacturer('Kia')">기아</button>
            <button onclick="selectManufacturer('BMW')">BMW</button>
        </div>

        <div class="filter-title">모델</div>
        <div class="filter-options" id="modelOptions">
            <!-- 모델은 제조사 선택 시 동적으로 삽입됩니다 -->
        </div>

        <div class="selected-conditions" id="selectedConditions">선택된 조건: 없음</div>

        <div class="search-button-box">
            <button id="searchBtn" onclick="searchCar()" disabled>선택한 조건 검색하기</button>
        </div>
    </div>
</section>

<section class="image-grid" id="imageContainer">
    <!-- 검색 결과 이미지가 이곳에 표시됩니다 -->
</section>

<script>
    let selectedManufacturer = '';
    let selectedModel = '';

    function selectManufacturer(manufacturer) {
        selectedManufacturer = manufacturer;
        selectedModel = '';
        highlightSelected('manufacturerOptions', manufacturer);
        updateSelectedConditionText();
        loadModels(manufacturer);
        document.getElementById('searchBtn').disabled = true;
    }

    function selectModel(model) {
        selectedModel = model;
        highlightSelected('modelOptions', model);
        updateSelectedConditionText();
        if (selectedManufacturer && selectedModel) {
            document.getElementById('searchBtn').disabled = false;
        }
    }

    function highlightSelected(containerId, value) {
        const buttons = document.querySelectorAll(`#${containerId} button`);
        buttons.forEach(btn => {
            btn.classList.toggle('selected', btn.textContent === value);
        });
    }

    function updateSelectedConditionText() {
        const box = document.getElementById('selectedConditions');
        if (selectedManufacturer && selectedModel) {
            box.textContent = `선택된 조건: ${selectedManufacturer} > ${selectedModel}`;
        } else if (selectedManufacturer) {
            box.textContent = `선택된 조건: ${selectedManufacturer}`;
        } else {
            box.textContent = `선택된 조건: 없음`;
        }
    }

    function loadModels(manufacturer) {
        const models = {
            Hyundai: ['Avante', 'Sonata', 'Tucson'],
            Kia: ['K5', 'Sportage', 'Carnival'],
            BMW: ['i7', 'i5', 'iX3', 'i4', 'iX2', 'm4-g82']
        };
        const container = document.getElementById('modelOptions');
        container.innerHTML = '';
        (models[manufacturer] || []).forEach(model => {
            const btn = document.createElement('button');
            btn.textContent = model;
            btn.onclick = () => selectModel(model);
            container.appendChild(btn);
        });
    }

    async function searchCar() {
        if (!selectedManufacturer || !selectedModel) return;
        const url = `/tuning/2d?manufacturer=${selectedManufacturer}&modelCode=${selectedModel}&category=car`;
        const response = await fetch(url);
        const images = await response.json();

        const container = document.getElementById('imageContainer');
        container.innerHTML = '';

        images.forEach((src) => {
            const card = document.createElement('div');
            card.className = 'car-card';

            const img = document.createElement('img');
            img.src = src;

            const name = document.createElement('div');
            name.className = 'car-name';
            name.textContent = `${selectedManufacturer} ${selectedModel}`;

            const detail = document.createElement('div');
            detail.className = 'car-detail';
            detail.textContent = '순수 전기';

            card.appendChild(img);
            card.appendChild(name);
            card.appendChild(detail);

            container.appendChild(card);
        });
    }
</script>
</body>
</html>
