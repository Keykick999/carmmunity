<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>회원가입</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR&display=swap');

        body {
            background-color: #f5f6fa;
            font-family: 'Noto Sans KR', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.6s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .signup-card {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.06);
            width: 100%;
            max-width: 420px;
        }

        .signup-card h2 {
            text-align: center;
            margin-bottom: 1.5rem;
            color: #343a40;
        }

        .form-floating {
            margin-bottom: 1rem;
        }

        .btn-primary {
            background-color: #4e73df;
            border: none;
        }

        .btn-primary:hover {
            background-color: #374fcf;
        }

        .btn-outline-secondary {
            border-color: #ced4da;
        }

        .btn-outline-secondary:hover {
            background-color: #dee2e6;
        }

        .auth-switch {
            text-align: center;
            margin-top: 1rem;
            font-size: 0.9rem;
        }

        .auth-switch a {
            color: #4e73df;
            text-decoration: none;
        }

        .auth-switch a:hover {
            text-decoration: underline;
        }

        .error-message {
            color: #dc3545;
            font-size: 0.85rem;
            margin-top: 0.25rem;
            display: none;
        }

        .result-message {
            text-align: center;
            margin-top: 1rem;
            padding: 1rem;
            border-radius: 6px;
            display: none;
        }

        .result-message.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .result-message.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .verification-group {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
<div class="signup-card">
    <h2>회원가입</h2>

    <div class="form-floating">
        <input type="text" class="form-control" id="userId" placeholder="아이디">
        <label for="userId">아이디</label>
        <div id="userIdError" class="error-message"></div>
    </div>

    <div class="form-floating">
        <input type="password" class="form-control" id="password" placeholder="비밀번호">
        <label for="password">비밀번호</label>
        <div id="passwordError" class="error-message"></div>
    </div>

    <div class="form-floating">
        <input type="text" class="form-control" id="name" placeholder="이름">
        <label for="name">이름</label>
        <div id="nameError" class="error-message"></div>
    </div>

    <div class="form-floating">
        <input type="email" class="form-control" id="email" placeholder="이메일">
        <label for="email">이메일</label>
        <div id="emailError" class="error-message"></div>
    </div>

    <div class="verification-group">
        <button class="btn btn-outline-secondary w-100" onclick="sendCode()">코드 발송</button>
    </div>

    <div class="verification-group">
        <input type="text" class="form-control" id="emailCode" placeholder="인증코드">
        <button class="btn btn-outline-secondary" onclick="verifyCode()">코드 확인</button>
    </div>

    <div class="form-floating">
        <input type="text" class="form-control" id="nickname" placeholder="닉네임">
        <label for="nickname">닉네임</label>
        <div id="nicknameError" class="error-message"></div>
    </div>

    <div class="form-floating">
        <input type="tel" class="form-control" id="phone" placeholder="전화번호 (선택)">
        <label for="phone">전화번호 (선택)</label>
    </div>

    <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" value="" id="agreeTerms">
        <label class="form-check-label" for="agreeTerms">약관에 동의합니다</label>
    </div>

    <button class="btn btn-primary w-100" onclick="signUp()">회원가입</button>

    <div id="resultMessage" class="result-message"></div>

    <div class="auth-switch">
        <a href="/login">로그인으로 돌아가기</a>
    </div>
</div>
<script src="/js/signup.js"></script>
</body>
</html>
