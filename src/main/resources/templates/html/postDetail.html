<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>게시글 상세 보기 | Carmmunity</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@500;700&display=swap');
        body {
            margin: 0;
            background-color: #f9f9f9;
            color: #333;
            font-family: 'Outfit', sans-serif;
        }

        .header {
            background-color: white;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ddd;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.5rem;
            font-weight: 700;
        }

        .logo img {
            height: 36px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .write-button {
            display: inline-block;
            padding: 8px 16px;
            background-color: #333;
            color: white;
            font-weight: 600;
            border-radius: 8px;
            text-decoration: none;
            transition: background-color 0.2s ease;
        }

        .write-button:hover {
            background-color: #555;
        }

        .user-profile {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            cursor: pointer;
        }

        .container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            padding: 30px 16px;
        }

        .post-title {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 16px;
        }

        .post-image {
            width: 100%;
            height: 400px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .post-content {
            font-size: 1.05rem;
            line-height: 1.7;
            margin-bottom: 30px;
        }

        .like-button {
            background-color: #eee;
            border: none;
            color: #ff4d4d;
            font-size: 1rem;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            margin-bottom: 20px;
        }

        .comment-section {
            background-color: #fff;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
            margin-bottom: 40px;
        }

        .comment {
            padding: 16px 0;
            border-bottom: 1px solid #eee;
        }

        .reply-toggle {
            font-size: 0.9rem;
            color: #00aaff;
            cursor: pointer;
            margin-top: 8px;
        }

        .reply-section {
            margin-left: 20px;
            background-color: #f1f1f1;
            padding: 12px;
            border-radius: 8px;
            margin-top: 10px;
        }

        .reply {
            padding: 8px 12px;
            border-left: 3px solid #ccc;
            background-color: #f9f9f9;
            margin: 6px 0 6px 16px;
            border-radius: 6px;
            font-size: 0.95rem;
        }

        .reply strong {
            display: inline-block;
            margin-bottom: 4px;
            color: #444;
        }

        .comment-input, .reply-input {
            display: flex;
            margin-top: 16px;
        }

        .comment-input input, .reply-input input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #ccc;
            border-radius: 20px;
            font-size: 1rem;
        }

        .comment-input button, .reply-input button {
            margin-left: 8px;
            padding: 10px 16px;
            border: none;
            background-color: #333;
            color: white;
            border-radius: 20px;
            cursor: pointer;
        }

        .reply-pagination {
            text-align: center;
            padding: 10px;
            font-size: 0.85rem;
            color: #888;
            cursor: pointer;
        }

        .like-button[data-liked="true"] {
            background-color: #ffdddd;
            font-weight: bold;
            color: #e60039;
        }

        .edit-input {
            width: 100%;
            padding: 6px;
            margin-top: 6px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .yt-like-button {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            font-size: 14px;
            font-weight: 500;
            color: #606060;
            background-color: transparent;
            border: 1px solid #ddd;
            border-radius: 20px;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }

        .yt-like-button:hover {
            background-color: #f2f2f2;
        }

        .yt-like-button[data-liked="true"] {
            background-color: #ffeef0;
            color: #cc0000;
            border-color: #cc0000;
        }

        .yt-like-button[data-liked="true"] i {
            color: #cc0000;
        }
    </style>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>

<!-- 공통 헤더 추가 -->
<header class="header">
    <div class="logo">
        <a href="/main"><img src="/image/logo.png" alt="로고" /></a>
        Carmmunity
    </div>
    <div class="header-right">
        <a href="/postCreate" class="write-button">+ 글쓰기</a>
        <img id="profileImage" src="/assets/default-profile.png" class="user-profile" alt="유저 프로필" onclick="location.href='/main.html'">
    </div>
</header>

<!-- 본문 영역 -->
<div class="container">
    <a href="/postList" class="btn btn-outline-secondary mb-3">← 게시글 목록으로</a>

    <input type="hidden" id="postId" th:value="${postId}" />
    <div id="post"></div>

    <div class="comment-section">
        <h4>댓글</h4>
        <div class="comment-input">
            <input type="text" placeholder="댓글을 입력하세요" id="commentInput">
            <button onclick="submitComment()">게시</button>
        </div>
        <div id="comments"></div>
    </div>
</div>
<script src="/js/postDetail.js"></script>
</body>
</html>
