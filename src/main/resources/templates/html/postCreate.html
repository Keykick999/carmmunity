<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시글 작성 | Carmmunity</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@500;700&display=swap');

        body {
            background-color: #f9f9f9;
            font-family: 'Outfit', sans-serif;
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }

        h2 {
            font-weight: 700;
            margin-bottom: 24px;
        }

        .form-control {
            margin-bottom: 20px;
        }

        .btn-primary {
            background-color: #333;
            border: none;
        }

        .btn-primary:hover {
            background-color: #555;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>게시글 작성</h2>
    <form id="postForm" enctype="multipart/form-data">
        <input type="text" id="title" name="title" class="form-control" placeholder="제목을 입력하세요" required>
        <textarea id="content" name="content" class="form-control" placeholder="내용을 입력하세요" rows="6" required></textarea>

        <!-- 게시글 유형 선택 박스 삭제 -->
        <input type="file" id="postImage" name="postImage" class="form-control">

        <button type="submit" class="btn btn-primary w-100">작성하기</button>
    </form>
</div>

<script>
    const form = document.getElementById('postForm');
    form.addEventListener('submit', function (e) {
        e.preventDefault();

        const token = localStorage.getItem('token');
        if (!token) {
            alert("로그인이 필요합니다.");
            window.location.href = "/";
            return;
        }

        const formData = new FormData();

        // postType을 무조건 "FREE"로 고정
        const postData = {
            title: document.getElementById("title").value,
            content: document.getElementById("content").value,
            postType: "FREE"
        };

        formData.append("postData", new Blob(
            [JSON.stringify(postData)],
            { type: "application/json" }
        ));

        const postImage = document.getElementById("postImage").files[0];
        if (postImage) {
            formData.append("postImage", postImage);
        }

        fetch('/posts', {
            method: 'POST',
            headers: {
                Authorization: `Bearer ${token}`
            },
            body: formData
        })
            .then(res => {
                if (!res.ok) throw new Error("게시글 작성 실패");
                return res.text();
            })
            .then(msg => {
                alert(msg);
                window.location.href = "/main"; // 작성 후 목록으로 이동
            })
            .catch(err => {
                console.error(err);
                alert("작성 중 오류가 발생했습니다.");
            });
    });
</script>
</body>
</html>
