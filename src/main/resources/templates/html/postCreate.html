<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시글 작성 | Carmmunity</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@500;700&display=swap');

        body {
            background-color: #f9f9f9;
            font-family: 'Outfit', sans-serif;
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }

        h2 {
            font-weight: 700;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            font-weight: 600;
            margin-bottom: 6px;
            display: block;
        }

        .btn-primary {
            background-color: #333;
            border: none;
        }

        .btn-primary:hover {
            background-color: #555;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>게시글 작성</h2>
    <form id="postForm" enctype="multipart/form-data">
        <div class="form-group">
            <label for="title">제목</label>
            <input type="text" id="title" name="title" class="form-control" placeholder="제목을 입력하세요" required>
        </div>

        <div class="form-group">
            <label for="content">내용</label>
            <textarea id="content" name="content" class="form-control" placeholder="내용을 입력하세요" rows="6" required></textarea>
        </div>

        <div class="form-group">
            <label for="thumbnailImage">썸네일 이미지 (목록에 표시)</label>
            <input type="file" id="thumbnailImage" name="thumbnailImage" class="form-control">
        </div>

        <div class="form-group">
            <label for="postImage">본문 이미지 (상세 페이지에 표시)</label>
            <input type="file" id="postImage" name="postImage" class="form-control">
        </div>

        <button type="submit" class="btn btn-primary w-100">작성하기</button>
    </form>
</div>

<script src="/js/postCreate.js"></script>

</body>
</html>
