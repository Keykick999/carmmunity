<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>3D Tuned Car Viewer</title>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; }
    </style>
</head>
<body>
<script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.141.0/build/three.module.js",
        "GLTFLoader": "https://unpkg.com/three@0.141.0/examples/jsm/loaders/GLTFLoader.js",
        "OrbitControls": "https://unpkg.com/three@0.141.0/examples/jsm/controls/OrbitControls.js"
      }
    }
</script>

<script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'GLTFLoader';
    import { OrbitControls } from 'OrbitControls';

    // 1. 기본 씬 설정
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 1, 5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // 2. 카메라 컨트롤 설정
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // 3. 라이트
    const light = new THREE.HemisphereLight(0xffffff, 0x444444);
    light.position.set(0, 20, 0);
    scene.add(light);

    // 4. Bearer 토큰 설정
    const token = 'Bearer eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJndXNkbjEyIiwiaWF0IjoxNzQ2NjE4NzA1LCJleHAiOjE3NDY2MjIzMDV9.KeHKQ_DqhzTHacZmN5LcmrFcFnYZNFfPVq48tcvpclw';

    // 5. GLB 로더 설정
    const loader = new GLTFLoader();
    loader.loader.setRequestHeader({ Authorization: token }); // ✅ 핵심 설정

    // 6. 모델 로드
    loader.load('http://localhost:8080/cars?carId=1', (gltf) => {
        scene.add(gltf.scene);
        animate();
    }, undefined, (error) => {
        console.error('GLB 파일 로딩 실패:', error);
    });

    // 7. 애니메이션 루프
    function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
    }

    // 8. 창 리사이즈 대응
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
