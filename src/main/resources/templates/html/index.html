<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>3D Tuned Car Viewer</title>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; }
    </style>
</head>
<body>

<script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.141.0/build/three.module.js",
        "GLTFLoader": "https://unpkg.com/three@0.141.0/examples/jsm/loaders/GLTFLoader.js",
        "OrbitControls": "https://unpkg.com/three@0.141.0/examples/jsm/controls/OrbitControls.js"
      }
    }
</script>

<script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'GLTFLoader';
    import { OrbitControls } from 'OrbitControls';

    // 1. 씬, 카메라, 렌더러
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xeeeeee);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 2, 30);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // 2. 컨트롤
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // 3. 라이트
    scene.add(new THREE.AmbientLight(0xffffff, 1.2));
    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
    hemiLight.position.set(0, 20, 0);
    scene.add(hemiLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 1);
    dirLight.position.set(5, 10, 7.5);
    scene.add(dirLight);

    // 4. Bearer 토큰
    const token = 'Bearer eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJndXNkbjEyIiwiaWF0IjoxNzQ2OTYxMzA5LCJleHAiOjE3NDY5NjQ5MDl9.1Z7EymL-YbU_orHi_Z7lrCatWl_OCr6EhsFQo2VB0Uo';

    // 5. fetch로 GLB 데이터 가져오기
    const modelUrl = 'http://localhost:8080/cars?carId=2';
    const loader = new GLTFLoader();

    fetch(modelUrl, {
        headers: {
            Authorization: token
        }
    })
        .then(response => {
            if (!response.ok) throw new Error('모델 요청 실패: ' + response.status);
            return response.arrayBuffer();
        })
        .then(arrayBuffer => {
            loader.parse(arrayBuffer, '', (gltf) => {
                scene.add(gltf.scene);
                animate();
            }, (error) => {
                console.error('GLTF 파싱 실패:', error);
            });
        })
        .catch(error => {
            console.error('GLB fetch 실패:', error);
        });

    // 6. 애니메이션 루프
    function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
    }

    // 7. 창 크기 조절 대응
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>

</body>
</html>
