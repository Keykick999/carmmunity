<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <title>차량 3D 미리보기</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script type="importmap">
        {
          "imports": {
            "three": "https://unpkg.com/three@0.141.0/build/three.module.js",
            "GLTFLoader": "https://unpkg.com/three@0.141.0/examples/jsm/loaders/GLTFLoader.js",
            "OrbitControls": "https://unpkg.com/three@0.141.0/examples/jsm/controls/OrbitControls.js"
          }
        }
    </script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Outfit', 'Segoe UI', sans-serif;
            background-color: #f4f5f7;
        }

        .viewer-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .loading-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.2rem;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.9);
            padding: 1rem 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
            z-index: 20;
        }

        .result-text {
            position: absolute;
            top: 5%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            padding: 0.6rem 1.8rem;
            border-radius: 32px;
            font-size: 1.3rem;
            font-weight: 600;
            z-index: 20;
            pointer-events: none;
        }

        .back-button {
            position: absolute;
            bottom: 24px;
            right: 24px;
            background-color: #111;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 0.6rem 1.4rem;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: background-color 0.3s;
            z-index: 15;
        }

        .back-button:hover {
            background-color: #333;
        }
    </style>
</head>
<body>
<div class="viewer-container">
    <div class="loading-indicator" id="loading">🚗 차량 불러오는 중...</div>
    <div class="result-text">✨ 튜닝 결과</div>
    <button class="back-button" onclick="location.href='/main'">🏠 메인으로</button>
</div>

<script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'GLTFLoader';
    import { OrbitControls } from 'OrbitControls';

    const container = document.querySelector('.viewer-container');
    const loadingEl = document.getElementById('loading');
    const width = container.clientWidth;
    const height = container.clientHeight;
    const aspect = width / height;
    const d = 4;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf5f6fa);

    const camera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, 0.1, 100);
    camera.position.set(0, 1.5, 14); // 📌 카메라 거리 조정
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(width, height);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.outputEncoding = THREE.sRGBEncoding;
    container.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
    const directionalLight = new THREE.DirectionalLight(0xffffff, 2.0);
    directionalLight.position.set(10, 10, 10);
    scene.add(ambientLight, directionalLight);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.1;
    controls.enableZoom = false;
    controls.minPolarAngle = Math.PI / 2;
    controls.maxPolarAngle = Math.PI / 2;

    const loader = new GLTFLoader();
    let currentModel = null;

    fetch('/shopping/compose', {
        method: 'POST',
        headers: {
            'Authorization': 'Bearer ' + localStorage.getItem('token')
        }
    })
        .then(res => res.json())
        .then(data => {
            const glbPath = data.glbPath;
            return fetch(glbPath).then(res => res.arrayBuffer());
        })
        .then(buffer => {
            loader.parse(buffer, '', (gltf) => {
                if (currentModel) scene.remove(currentModel);

                currentModel = gltf.scene;

                const box = new THREE.Box3().setFromObject(currentModel);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());

                currentModel.position.sub(center);
                currentModel.position.y -= size.y * 0.5; // 🎯 하단이 너무 내려가지 않도록 조정
                currentModel.scale.set(0.8, 0.8, 0.8);
                scene.add(currentModel);

                controls.target.set(0, -size.y * 0.3, 0);
                controls.update();

                loadingEl.style.display = 'none';
            });
        })
        .catch(err => {
            console.error('모델 로딩 실패:', err);
            loadingEl.innerText = '🚫 모델 로드 실패';
        });

    function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
        const width = container.clientWidth;
        const height = container.clientHeight;
        const aspect = width / height;
        camera.left = -d * aspect;
        camera.right = d * aspect;
        camera.top = d;
        camera.bottom = -d;
        camera.updateProjectionMatrix();
        renderer.setSize(width, height);
    });
</script>
</body>
</html>
