<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carmmunity 로그인</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@500;700&display=swap');

        body {
            background-color: #fafafa;
            font-family: 'Outfit', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .auth-box {
            background-color: #fff;
            border: 1px solid #dbdbdb;
            border-radius: 12px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .logo {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
        }

        .logo img {
            height: 40px;
        }

        .form-floating {
            margin-bottom: 1rem;
        }

        .btn-login {
            width: 100%;
            background-color: #0095f6;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: 600;
        }

        .btn-login:hover {
            background-color: #0077cc;
        }

        .auth-links {
            margin-top: 1rem;
            font-size: 0.9rem;
        }

        .auth-links a {
            color: #0095f6;
            text-decoration: none;
        }

        .auth-links a:hover {
            text-decoration: underline;
        }

        .error-message {
            color: #dc3545;
            font-size: 0.85rem;
            display: none;
        }
    </style>
</head>
<body>
<div class="auth-box">
    <div class="logo">
        <img src="/image/logo.png" alt="Carmmunity Logo">
        Carmmunity
    </div>

    <div class="form-floating">
        <input type="text" class="form-control" id="userIdInput" placeholder="아이디">
        <label for="userIdInput">아이디</label>
        <div id="userIdError" class="error-message"></div>
    </div>

    <div class="form-floating">
        <input type="password" class="form-control" id="passwordInput" placeholder="비밀번호">
        <label for="passwordInput">비밀번호</label>
        <div id="passwordError" class="error-message"></div>
    </div>

    <button class="btn-login" id="loginBtn">로그인</button>

    <div class="auth-links">
        <div><a href="/signUp">회원가입</a></div>
        <div><a href="/id-find">아이디 찾기</a> | <a href="/pw-find">비밀번호 초기화</a></div>
    </div>

    <div id="resultMessage" class="error-message mt-3"></div>
</div>
<script src="/js/start.js"></script>
</body>
</html>
