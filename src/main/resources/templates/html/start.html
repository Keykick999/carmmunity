<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Car Community - 홈</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR&display=swap');

        body {
            background-color: #f5f6fa;
            font-family: 'Noto Sans KR', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.6s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .signup-container {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.06);
            width: 100%;
            max-width: 420px;
        }

        .signup-container h2 {
            text-align: center;
            margin-bottom: 1.5rem;
            color: #343a40;
        }

        .form-floating {
            margin-bottom: 1rem;
        }

        .btn-primary {
            width: 100%;
            padding: 0.75rem;
            background-color: #4e73df;
            border: none;
        }

        .btn-primary:hover {
            background-color: #374fcf;
        }

        .btn-outline-primary {
            white-space: nowrap;
        }

        .btn-outline-secondary {
            width: 100%;
            margin-top: 0.5rem;
        }

        .auth-switch {
            text-align: center;
            margin-top: 1rem;
            font-size: 0.9rem;
        }

        .auth-switch a {
            color: #4e73df;
            text-decoration: none;
        }

        .auth-switch a:hover {
            text-decoration: underline;
        }

        .error-message {
            color: #dc3545;
            font-size: 0.85rem;
            display: none;
        }

        .result-message {
            text-align: center;
            margin-top: 1rem;
            padding: 1rem;
            border-radius: 6px;
            display: none;
        }

        .result-message.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .result-message.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .verification-group {
            display: flex;
            gap: 10px;
        }
    </style>
</head>
<body>
<div class="signup-container">
    <h2>Car Community</h2>

    <div class="form-floating">
        <input type="text" class="form-control" id="userIdInput" placeholder="아이디">
        <label for="userIdInput">아이디</label>
        <div id="userIdError" class="error-message"></div>
    </div>

    <div class="form-floating">
        <input type="password" class="form-control" id="passwordInput" placeholder="비밀번호">
        <label for="passwordInput">비밀번호</label>
        <div id="passwordError" class="error-message"></div>
    </div>

    <button class="btn btn-primary" id="loginBtn">로그인</button>

    <div class="auth-switch">
        <a href="/signUp">회원가입</a> |
        <a href="/id-find">아이디 찾기</a> |
        <a href="/find-password">비밀번호 찾기</a>
    </div>

    <div id="resultMessage" class="result-message"></div>
</div>
</body>
<script src="/js/start.js"></script>
</html>
