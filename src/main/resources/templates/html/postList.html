<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시글 목록 | Carmmunity</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@500;700&display=swap');

        body {
            margin: 0;
            background-color: #f9f9f9;
            font-family: 'Outfit', sans-serif;
        }

        .header {
            background-color: white;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ddd;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.5rem;
            font-weight: 700;
        }

        .logo img {
            height: 36px;
        }

        .user-profile {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            cursor: pointer;
        }

        .search-container {
            display: flex;
            justify-content: center;
            padding: 20px 16px;
        }

        .search-input {
            width: 100%;
            max-width: 600px;
            padding: 10px 16px;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 30px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            padding: 20px;
            max-width: 1400px;
            margin: auto;
            padding-bottom: 300px; /* ✅ 댓글창을 위한 여유 공간 확보 */
        }

        .post-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
            overflow: hidden;
            transition: transform 0.2s;
            cursor: pointer;
        }

        .post-card:hover {
            transform: translateY(-4px);
        }

        .post-card img.thumbnail {
            width: 100%;
            height: 160px;
            object-fit: cover;
        }

        .post-content {
            padding: 14px;
        }

        .post-user {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .post-user img {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
        }

        .post-meta {
            font-size: 0.9rem;
            color: #777;
            display: flex;
            justify-content: space-between;
        }

        .post-title {
            font-weight: 600;
            margin: 5px 0 8px;
            font-size: 1rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .write-button {
            display: inline-block;
            padding: 8px 16px;
            background-color: #333;
            color: white;
            font-weight: 600;
            border-radius: 8px;
            text-decoration: none;
            transition: background-color 0.2s ease;
        }

        .write-button:hover {
            background-color: #555;
        }

        /* ✅ 댓글창 스타일 추가 */
        .comment-section {
            position: fixed;
            bottom: 5%;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            max-width: 800px;
            height: 20%;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            overflow-y: auto;
            padding: 12px 16px;
            z-index: 999;
        }

        /* ✅ 댓글 입력창 기본 스타일 */
        .comment-section input,
        .comment-section textarea {
            width: 100%;
            border-radius: 6px;
            border: 1px solid #ccc;
            padding: 8px;
            font-size: 0.95rem;
            resize: none;
        }
    </style>
</head>
<body>
<header class="header">
    <div class="logo">
        <img src="/image/logo.png" alt="로고">
        Carmmunity
    </div>
    <div class="header-right">
        <a href="/postCreate" class="write-button">+ 글쓰기</a>
        <img id="profileImage" src="/assets/default-profile.png" class="user-profile" alt="유저 프로필" onclick="location.href='/main.html'">
    </div>
</header>


<div class="search-container">
    <div style="display: flex; gap: 10px; width: 100%; max-width: 600px;">
        <input type="text" id="searchInput" class="search-input" placeholder="제목으로 입력해주세요..." />
        <button id="searchButton" style="border: none; background: none; cursor: pointer;">
            🔍
        </button>
    </div>
</div>


<main class="grid" id="postGrid">
</main>
<div id="observerTarget" style="height: 1px;"></div>



<script type="module" src="/js/postlist.js"></script>
</body>
</html>
