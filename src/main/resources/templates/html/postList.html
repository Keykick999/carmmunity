<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시글 목록 | Carmmunity</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@500;700&display=swap');

        body {
            margin: 0;
            background-color: #f9f9f9;
            font-family: 'Outfit', sans-serif;
        }

        .header {
            background-color: white;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ddd;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.5rem;
            font-weight: 700;
        }

        .logo img {
            height: 36px;
        }

        .user-profile {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            cursor: pointer;
        }
        /* 기존 search-container, search-input, grid 등 스타일은 유지 */
        .search-container {
            display: flex;
            justify-content: center;
            padding: 20px 16px;
        }

        .search-input {
            width: 100%;
            max-width: 600px;
            padding: 10px 16px;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 30px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            padding: 20px;
            max-width: 1400px;
            margin: auto;
            padding-bottom: 300px; /* 댓글창을 위한 여유 공간 확보 */
        }

        .post-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
            overflow: hidden;
            transition: transform 0.2s;
            cursor: pointer;
        }

        .post-card:hover {
            transform: translateY(-4px);
        }

        .post-card img.thumbnail {
            width: 100%;
            height: 160px;
            object-fit: cover;
        }

        .post-content {
            padding: 14px;
        }

        .post-user {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .post-user img {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
        }

        .post-meta {
            font-size: 0.9rem;
            color: #777;
            display: flex;
            justify-content: space-between;
        }

        .post-title {
            font-weight: 600;
            margin: 5px 0 8px;
            font-size: 1rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .write-button {
            display: inline-block;
            padding: 8px 16px;
            background-color: #333;
            color: white;
            font-weight: 600;
            border-radius: 8px;
            text-decoration: none;
            transition: background-color 0.2s ease;
            /* 버튼들이 일관된 높이를 가지도록 조정 */
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .write-button:hover {
            background-color: #555;
        }

        /* 새로 추가된 친구 버튼 스타일 */
        .friend-button {
            /* 글쓰기 버튼과 동일한 스타일을 적용하되, 색상만 다르게 */
            background-color: #0d6efd; /* 부트스트랩 primary 색상 활용 */
            color: white;
            border: none;
            cursor: pointer;
        }
        .friend-button:hover {
            background-color: #0a58ca;
        }

        /* 댓글창 스타일 추가 */
        .comment-section {
            position: fixed;
            bottom: 5%;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            max-width: 800px;
            height: 20%;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            overflow-y: auto;
            padding: 12px 16px;
            z-index: 999;
        }

        /* 댓글 입력창 기본 스타일 */
        .comment-section input,
        .comment-section textarea {
            width: 100%;
            border-radius: 6px;
            border: 1px solid #ccc;
            padding: 8px;
            font-size: 0.95rem;
            resize: none;
        }

        .search-container {
            display: flex;
            justify-content: center;
            padding: 30px 16px 10px;
        }

        .search-wrapper {
            display: flex;
            width: 100%;
            max-width: 640px;
            border: 1px solid #ccc;
            border-radius: 40px;
            background-color: #fff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            overflow: hidden;
        }

        .search-input {
            flex: 1;
            border: none;
            padding: 14px 20px;
            font-size: 1rem;
            outline: none;
            background: transparent;
            border-radius: 40px 0 0 40px;
        }

        .search-button {
            background-color: #0d6efd;
            color: white;
            border: none;
            padding: 12px 26px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            border-radius: 0 40px 40px 0;
            transition: background-color 0.2s ease;
        }

        .search-button:hover {
            background-color: #0a58ca;
        }

        /* 모달 내 검색 결과 및 요청 목록 스타일 */
        .user-list-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }
        .user-list-item:last-child {
            border-bottom: none;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .user-info img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
        }
    </style>
</head>
<body>
<header class="header">
    <div class="logo">
        <a href="/main"><img src="/image/logo.png" alt="로고" /></a>
        Carmmunity
    </div>
    <div class="header-right">
        <button
                id="friendshipBtn"
                class="write-button friend-button"
                data-bs-toggle="modal"
                data-bs-target="#friendshipModal"
        >
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" class="bi bi-person-plus-fill" viewBox="0 0 16 16">
                <path d="M1 14s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1zm5-7a3 3 0 1 0 0-6 3 3 0 0 0 0 6"/>
                <path fill-rule="evenodd" d="M15.5 11a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h1.793l-3.147-3.146a.5.5 0 1 1 .708-.708l3.146 3.147V11.5a.5.5 0 0 1 .5-.5z"/>
            </svg>
        </button>
        <a href="/postCreate" class="write-button">+ 글쓰기</a>
        <img id="profileImage" src="/assets/default-profile.png" class="user-profile" alt="유저 프로필" onclick="location.href='/main'">
    </div>
</header>


<div class="search-container">
    <div class="search-wrapper">
        <input
                type="text"
                id="searchInput"
                class="search-input"
                placeholder="제목 또는 키워드를 입력하세요..."
        />
        <button id="searchButton" class="search-button">검색</button>
    </div>
</div>



<main class="grid" id="postGrid">
</main>
<div id="observerTarget" style="height: 1px;"></div>


<div class="modal fade" id="friendshipModal" tabindex="-1" aria-labelledby="friendshipModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="friendshipModalLabel">친구/팔로우 관리</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <ul class="nav nav-tabs" id="friendshipTabs" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active" id="search-tab" data-bs-toggle="tab" data-bs-target="#search-pane" type="button" role="tab" aria-controls="search-pane" aria-selected="true">🔍 사용자 검색</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="request-tab" data-bs-toggle="tab" data-bs-target="#request-pane" type="button" role="tab" aria-controls="request-pane" aria-selected="false">✉️ 받은 요청 <span class="badge bg-danger" id="requestCount">0</span></button>
                    </li>
                </ul>

                <div class="tab-content" id="friendshipTabContent">
                    <div class="tab-pane fade show active p-3" id="search-pane" role="tabpanel" aria-labelledby="search-tab">
                        <div class="input-group mb-3">
                            <input type="text" class="form-control" placeholder="닉네임으로 검색하세요" id="nicknameSearchInput">
                            <button class="btn btn-outline-primary" type="button" id="searchNicknameBtn">검색</button>
                        </div>
                        <div id="searchResultList" class="list-group list-group-flush">
                            <div class="text-muted text-center py-3">닉네임을 입력하고 검색하세요.</div>
                        </div>
                    </div>

                    <div class="tab-pane fade p-3" id="request-pane" role="tabpanel" aria-labelledby="request-tab">
                        <div id="receivedRequestList" class="list-group list-group-flush">
                            <div class="text-muted text-center py-3">새로운 요청이 없습니다.</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="/js/postlist.js"></script>
</body>
</html>
