<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시글 목록 | Carmmunity</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@500;700&display=swap');

        body {
            margin: 0;
            background-color: #f9f9f9;
            font-family: 'Outfit', sans-serif;
        }

        .header {
            background-color: white;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ddd;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.5rem;
            font-weight: 700;
        }

        .logo img {
            height: 36px;
        }

        .user-profile {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            cursor: pointer;
        }
        /* 기존 search-container, search-input, grid 등 스타일은 유지 */
        .search-container {
            display: flex;
            justify-content: center;
            padding: 20px 16px;
        }

        .search-input {
            width: 100%;
            max-width: 600px;
            padding: 10px 16px;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 30px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            padding: 20px;
            max-width: 1400px;
            margin: auto;
            padding-bottom: 300px; /* 댓글창을 위한 여유 공간 확보 */
        }

        .post-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
            overflow: hidden;
            transition: transform 0.2s;
            cursor: pointer;
        }

        .post-card:hover {
            transform: translateY(-4px);
        }

        .post-card img.thumbnail {
            width: 100%;
            height: 160px;
            object-fit: cover;
        }

        .post-content {
            padding: 14px;
        }

        .post-user {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .post-user img {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
        }

        .post-meta {
            font-size: 0.9rem;
            color: #777;
            display: flex;
            justify-content: space-between;
        }

        .post-title {
            font-weight: 600;
            margin: 5px 0 8px;
            font-size: 1rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .write-button {
            display: inline-block;
            padding: 8px 16px;
            background-color: #333;
            color: white;
            font-weight: 600;
            border-radius: 8px;
            text-decoration: none;
            transition: background-color 0.2s ease;
            /* 버튼들이 일관된 높이를 가지도록 조정 */
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .write-button:hover {
            background-color: #555;
        }

        /* 새로 추가된 친구 버튼 스타일 */
        .friend-button {
            /* 글쓰기 버튼과 동일한 스타일을 적용하되, 색상만 다르게 */
            background-color: #0d6efd; /* 부트스트랩 primary 색상 활용 */
            color: white;
            border: none;
            cursor: pointer;
        }
        .friend-button:hover {
            background-color: #0a58ca;
        }

        /* 댓글창 스타일 추가 */
        .comment-section {
            position: fixed;
            bottom: 5%;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            max-width: 800px;
            height: 20%;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            overflow-y: auto;
            padding: 12px 16px;
            z-index: 999;
        }

        /* 댓글 입력창 기본 스타일 */
        .comment-section input,
        .comment-section textarea {
            width: 100%;
            border-radius: 6px;
            border: 1px solid #ccc;
            padding: 8px;
            font-size: 0.95rem;
            resize: none;
        }

        .search-container {
            display: flex;
            justify-content: center;
            padding: 30px 16px 10px;
        }

        .search-wrapper {
            display: flex;
            width: 100%;
            max-width: 640px;
            border: 1px solid #ccc;
            border-radius: 40px;
            background-color: #fff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            overflow: hidden;
        }

        .search-input {
            flex: 1;
            border: none;
            padding: 14px 20px;
            font-size: 1rem;
            outline: none;
            background: transparent;
            border-radius: 40px 0 0 40px;
        }

        .search-button {
            background-color: #0d6efd;
            color: white;
            border: none;
            padding: 12px 26px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            border-radius: 0 40px 40px 0;
            transition: background-color 0.2s ease;
        }

        .search-button:hover {
            background-color: #0a58ca;
        }

        /* 모달 내 검색 결과 및 요청 목록 스타일 */
        .user-list-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }
        .user-list-item:last-child {
            border-bottom: none;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .user-info img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
        }

        #chatModal .modal-dialog {
            /* 기본: 모바일/중앙 */
            max-width: 100%;
            height: 100vh;
            margin: 0;
        }
        @media (min-width: 768px) {
            /* 데스크톱: 드래그를 위해 position: fixed를 absolute로 변경 */
            #chatModal .modal-dialog {
                max-width: 380px;
                height: 550px;
                position: absolute; /* 드래그 가능하도록 변경 */
                top: 30px; /* 초기 위치 설정 */
                left: calc(100% - 410px); /* 초기 위치 설정 (우측에서 30px 떨어진 곳) */
                margin: 0;
                cursor: grab; /* 드래그 가능한 커서 */
            }
        }
        #chatModal .modal-content {
            height: 100%;
            display: flex;
            flex-direction: column;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
        }
        #chatModal .modal-header {
            /* 드래그 핸들러 */
            cursor: grab;
            border-bottom: 1px solid #eee;
            user-select: none; /* 드래그 시 텍스트 선택 방지 */
        }

        #chatModal .modal-body {
            /* 🚩 [추가] 1. .modal-header를 제외한 나머지 공간을 모두 차지하도록 설정 */
            flex-grow: 1;

            /* 🚩 [추가] 2. flex 자식이 부모(modal-content)를 넘치지 않도록 높이 기준점 설정 */
            min-height: 0;
        }

        #chatContent {
            flex-grow: 1;
            overflow-y: auto;
            background-color: #f0f2f5;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-height: 0;
        }


        .message-input-area {
            padding: 10px 15px;
            border-top: 1px solid #ddd;
            display: flex;
            align-items: center;
            background-color: white;
        }
        .chat-bubble {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 18px;
            word-wrap: break-word;
            font-size: 0.95rem;
            line-height: 1.4;
            display: flex;
            flex-direction: column; /* 메시지 + 안 읽음 카운트 */
        }
        .incoming {
            background-color: #fff;
            align-self: flex-start;
            border: 1px solid #e5e5e5;
            border-bottom-left-radius: 4px;
        }
        .outgoing {
            background-color: #0d6efd;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        /* 안 읽음 카운트 스타일 */
        .unread-count {
            font-size: 0.75rem;
            color: #ffc107; /* 노란색 경고 */
            align-self: flex-end;
            margin-top: 2px;
            margin-right: 5px;
        }
        .incoming .unread-count {
            display: none; /* 받은 메시지에는 안 읽음 카운트 표시 안 함 */
        }
        /* 로딩 스피너 스타일 */
        .chat-loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            gap: 10px;
            color: #666;
        }

        #chatInput {
            border-radius: 20px !important;
            padding: 8px 15px;
        }
        #sendChatBtn {
            border-radius: 20px !important;
            font-weight: 600;
        }
    </style>
</head>
<body>
<header class="header">
    <div class="logo">
        <a href="/main"><img src="/image/logo.png" alt="로고" /></a>
        Carmmunity
    </div>
    <div class="header-right">
        <button
                id="friendshipBtn"
                class="write-button friend-button position-relative"
                data-bs-toggle="modal"
                data-bs-target="#friendshipModal"
        >
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" class="bi bi-person-plus-fill" viewBox="0 0 16 16">
                <path d="M1 14s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1zm5-7a3 3 0 1 0 0-6 3 3 0 0 0 0 6"/>
                <path fill-rule="evenodd" d="M15.5 11a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h1.793l-3.147-3.146a.5.5 0 1 1 .708-.708l3.146 3.147V11.5a.5.5 0 0 1 .5-.5z"/>
            </svg>
            <span id="notificationBadge"
                  class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger d-none"
                  style="font-size: 0.7em; padding: 4px 6px;">
                0
            </span>
        </button>
        <a href="/postCreate" class="write-button">+ 글쓰기</a>
        <img id="profileImage" src="/assets/default-profile.png" class="user-profile" alt="유저 프로필" onclick="location.href='/main'">
    </div>
</header>


<div class="search-container">
    <div class="search-wrapper">
        <input
                type="text"
                id="searchInput"
                class="search-input"
                placeholder="제목 또는 키워드를 입력하세요..."
        />
        <button id="searchButton" class="search-button">검색</button>
    </div>
</div>



<main class="grid" id="postGrid">
</main>
<div id="observerTarget" style="height: 1px;"></div>


<div class="modal fade" id="friendshipModal" tabindex="-1" aria-labelledby="friendshipModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="friendshipModalLabel">친구/팔로우 관리</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <ul class="nav nav-tabs" id="friendshipTabs" role="tablist">
                    <!-- 🚩 [수정] 친구 목록 탭을 active로 설정 -->
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active" id="following-tab" data-bs-toggle="tab" data-bs-target="#following-pane" type="button" role="tab" aria-controls="following-pane" aria-selected="true">👥 친구 목록 (Following)</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="search-tab" data-bs-toggle="tab" data-bs-target="#search-pane" type="button" role="tab" aria-controls="search-pane" aria-selected="false">🔍 사용자 검색</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="request-tab" data-bs-toggle="tab" data-bs-target="#request-pane" type="button" role="tab" aria-controls="request-pane" aria-selected="false">✉️ 받은 요청 <span class="badge bg-danger" id="requestCount">0</span></button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="notification-tab" data-bs-toggle="tab" data-bs-target="#notification-pane" type="button" role="tab" aria-controls="notification-pane" aria-selected="false">
                            🔔 알림
                            <!-- [이 부분 추가] -->
                            <span class="badge bg-danger ms-1 d-none" id="notificationModalBadge">0</span>
                        </button>
                    </li>
                </ul>

                <div class="tab-content" id="friendshipTabContent">
                    <!-- 친구 목록 탭 내용에 show active 클래스 추가 -->
                    <div class="tab-pane fade show active p-3" id="following-pane" role="tabpanel" aria-labelledby="following-tab">
                        <div class="d-flex justify-content-end mb-2">
                            <button class="btn btn-sm btn-outline-secondary" id="refreshFollowingListBtn" style="font-size: 0.8rem; padding: 0.15rem 0.4rem;">
                                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" class="bi bi-arrow-clockwise" viewBox="0 0 16 16" style="vertical-align: -0.125em;">
                                    <path fill-rule="evenodd" d="M8 3a5 5 0 1 0 4.546 2.914.5.5 0 0 1 .908-.417A6 6 0 1 1 8 2z"/>
                                    <path d="M8 4.466V.534a.25.25 0 0 1 .41-.192l2.36 1.966c.12.1.12.284 0 .384L8.41 4.658A.25.25 0 0 1 8 4.466"/>
                                </svg>
                                새로고침
                            </button>
                        </div>

                        <div id="followingList" class="list-group list-group-flush">
                            <div class="text-muted text-center py-3">로딩 중...</div>
                        </div>
                    </div>

                    <!-- 사용자 검색 탭 내용에서 show active 클래스 제거 -->
                    <div class="tab-pane fade p-3" id="search-pane" role="tabpanel" aria-labelledby="search-tab">
                        <div class="input-group mb-3">
                            <input type="text" class="form-control" placeholder="닉네임으로 검색하세요" id="nicknameSearchInput">
                            <button class="btn btn-outline-primary" type="button" id="searchNicknameBtn">검색</button>
                        </div>
                        <div id="searchResultList" class="list-group list-group-flush">
                            <div class="text-muted text-center py-3">닉네임을 입력하고 검색하세요.</div>
                        </div>
                    </div>

                    <div class="tab-pane fade p-3" id="request-pane" role="tabpanel" aria-labelledby="request-tab">
                        <div id="receivedRequestList" class="list-group list-group-flush">
                            <div class="text-muted text-center py-3">새로운 요청이 없습니다.</div>
                        </div>
                    </div>

                    <div class="tab-pane fade p-3" id="notification-pane" role="tabpanel" aria-labelledby="notification-tab">
                        <!-- 알림 목록이 여기에 렌더링됩니다 -->
                        <div id="notificationList" class="list-group list-group-flush">
                            <div class="text-muted text-center py-3">새로운 알림이 없습니다.</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 채팅 모달 (Chat Modal) -->
<div class="modal fade" id="chatModal" tabindex="-1" aria-labelledby="chatModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-end">
        <div class="modal-content">
            <!-- 헤더에 id 추가 -->
            <div class="modal-header" id="chatModalHeader">
                <h5 class="modal-title" id="chatModalLabel">채팅: <span id="chatTargetNickname">...</span></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-0 d-flex flex-column">
                <!-- 임시 메시지 제거 -->
                <div id="chatContent" class="flex-grow-1">
                    <!-- 메시지 로드/연결 시 여기에 내용이 채워집니다. -->
                </div>
                <div class="message-input-area">
                    <!-- 기본 disabled 처리 -->
                    <input type="text" class="form-control me-2" placeholder="메시지를 입력하세요" id="chatInput" disabled>
                    <button class="btn btn-primary" id="sendChatBtn" disabled>전송</button>
                </div>
            </div>
        </div>
    </div>
</div>
<!-- SockJS (STOMP 의존성) -->
<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.6.1/dist/sockjs.min.js"></script>
<!-- STOMP (WebSocket 클라이언트) -->
<script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>

<!-- 🚩 2. 부트스트랩 (기존 스크립트) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="/js/postList.js"></script>
</body>
</html>
