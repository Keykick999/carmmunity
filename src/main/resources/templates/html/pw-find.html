<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carmmunity 비밀번호 재설정</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@500;700&display=swap');
    body {
      background-color: #fafafa;
      font-family: 'Outfit', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .reset-box {
      background-color: #fff;
      border: 1px solid #dbdbdb;
      border-radius: 12px;
      padding: 40px;
      width: 100%;
      max-width: 450px;
      text-align: center;
    }
    .logo {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 30px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
    }
    .logo img {
      height: 40px;
    }
    .form-floating {
      margin-bottom: 1rem;
      text-align: left;
    }
    .verification-group {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
    .btn-submit {
      width: 100%;
      background-color: #0095f6;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-weight: 600;
    }
    .btn-submit:hover {
      background-color: #0077cc;
    }
    .btn-outline-secondary {
      font-weight: 600;
    }
    .error-message {
      color: #dc3545;
      font-size: 0.85rem;
      display: none;
    }
    .result-message {
      margin-top: 1rem;
      padding: 1rem;
      border-radius: 6px;
      display: none;
      font-size: 0.95rem;
    }
    .result-message.success {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    .result-message.error {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    .auth-switch {
      text-align: center;
      margin-top: 1rem;
      font-size: 0.9rem;
    }
    .auth-switch a {
      color: #0095f6;
      text-decoration: none;
    }
    .auth-switch a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
<div class="reset-box">
  <div class="logo">
    <a href="/main"><img src="/image/logo.png" alt="로고" /></a>
    Carmmunity
  </div>

  <div class="form-floating">
    <input type="email" class="form-control" id="email" placeholder="이메일">
    <label for="email">이메일</label>
    <div id="emailError" class="error-message"></div>
  </div>

  <div class="verification-group">
    <button class="btn btn-outline-secondary w-100" onclick="sendCode()">인증 코드 보내기</button>
  </div>

  <div class="verification-group">
    <input type="text" class="form-control" id="emailCode" placeholder="인증코드">
    <button class="btn btn-outline-secondary" onclick="verifyCode()">인증 확인</button>
  </div>

  <div class="form-floating">
    <input type="password" class="form-control" id="newPassword" placeholder="새 비밀번호">
    <label for="newPassword">새 비밀번호</label>
    <div id="newPwError" class="error-message"></div>
  </div>

  <div class="form-floating">
    <input type="password" class="form-control" id="confirmPassword" placeholder="비밀번호 확인">
    <label for="confirmPassword">비밀번호 확인</label>
    <div id="confirmPwError" class="error-message"></div>
  </div>

  <button class="btn-submit" onclick="resetPassword()">비밀번호 재설정</button>

  <div id="resultMessage" class="result-message"></div>

  <div class="auth-switch">
    <a href="/">로그인으로 돌아가기</a>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="/js/pw-find.js"></script>
</body>
</html>
