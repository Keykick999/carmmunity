<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carmmunity 회원 정보 수정</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@500;700&display=swap');
        body {
            background-color: #fafafa;
            font-family: 'Outfit', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
        }

        .header {
            background-color: white;
            width: 100%;
            padding: 16px 32px;
            border-bottom: 1px solid #dee2e6;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .header img { height: 40px; }
        .header-title { font-size: 2rem; font-weight: 700; }

        .modify-box {
            background-color: #fff;
            border: 1px solid #dbdbdb;
            border-radius: 12px;
            padding: 30px;
            margin-top: 40px;
            width: 100%;
            max-width: 500px;
        }

        .form-label { font-weight: 600; margin-top: 12px; }
        .image-preview {
            display: block; margin: 10px auto;
            width: 100px; height: 100px;
            border-radius: 50%;
            object-fit: cover; border: 2px solid #ccc;
        }

        .default-images {
            display: flex; justify-content: center;
            gap: 10px; flex-wrap: wrap; margin-top: 10px;
        }

        .default-images img {
            width: 50px; height: 50px;
            border-radius: 50%; cursor: pointer;
            border: 2px solid transparent;
        }

        .default-images img.selected { border-color: #0095f6; }

        .btn-group {
            display: flex; justify-content: space-between;
            gap: 10px; margin-top: 30px;
        }

        .btn-cancel { background-color: #6c757d; color: white; }
        .btn-save { background-color: #0095f6; color: white; }

        .btn-save:hover { background-color: #007acc; }
        .btn-cancel:hover { background-color: #5a6268; }
    </style>
</head>
<body>
<div class="header">
    <img src="/image/logo.png" alt="Carmmunity 로고">
    <div class="header-title">Carmmunity</div>
</div>

<div class="modify-box">
    <h2>회원 정보 수정</h2>
    <form id="modifyForm" enctype="multipart/form-data">
        <label class="form-label" for="uploadImage">프로필 이미지 업로드</label>
        <input type="file" class="form-control" id="uploadImage" name="profileImage" accept="image/*" />
        <img id="previewImage" class="image-preview" src="/static/image/default1.png" alt="미리보기" />

        <label class="form-label">기본 이미지 선택</label>
        <div class="default-images" id="defaultImageContainer">
            <img src="/static/image/UserImage1.png" alt="기본이미지1">
            <img src="/static/image/UserImage2.png" alt="기본이미지2">
            <img src="/static/image/UserImage3.png" alt="기본이미지3">
            <img src="/static/image/UserImage4.png" alt="기본이미지4">

        </div>

        <label class="form-label" for="nickname">닉네임</label>
        <input type="text" class="form-control" id="nickname" name="nickname" required />

        <label class="form-label" for="phone">전화번호</label>
        <input type="tel" class="form-control" id="phone" name="phone" />

        <label class="form-label" for="introduction">자기소개</label>
        <textarea class="form-control" id="introduction" name="introduction" rows="3"></textarea>

        <div class="btn-group">
            <button type="button" class="btn btn-cancel" onclick="location.href='/main.html'">취소</button>
            <button type="submit" class="btn btn-save">저장</button>
        </div>
    </form>
</div>

<script type="module" src="/js/modifyinfo.js"></script>
</body>
</html>
